<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emberfall Online</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--gold:#e3a41c;--blue:#0b64b8;--blue2:#063f78;--panel:rgba(70,32,14,.82);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(40,18,8,.88)}}
:root[data-theme="dark"]{--panel:rgba(40,18,8,.88)}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{height:100%;margin:0;background:#1a0d06;color:var(--ink);font:700 12px/1.3 system-ui,sans-serif;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none}#ui>*,#ui .scr>*{pointer-events:auto}
.ab{position:fixed}.scr{position:fixed;inset:0;pointer-events:none}
.b{border:2px solid #0a2a50;background:linear-gradient(#1a7de0,var(--blue2));color:#fff;border-radius:5px;padding:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;margin-bottom:9px;cursor:pointer;font:700 12px system-ui}
.b i{font-style:normal;padding:0 4px}
.col{position:absolute;top:22%;width:min(33vw,170px)}.l{left:2.5%}.r{right:2.5%}
.title{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(40,18,8,.7);padding:6px 16px;border-radius:6px;font-size:14px;white-space:nowrap}
.bot{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
input{background:rgba(40,18,8,.8);color:#fff;border:2px solid var(--gold);border-radius:5px;padding:6px;text-align:center;font:700 13px system-ui;width:150px;user-select:text;-webkit-user-select:text}
button.g,button.o{color:#fff;border:2px solid #052;border-radius:5px;padding:9px 18px;font:700 13px system-ui;background:linear-gradient(#2fc040,#127a22)}
button.o{position:absolute;right:2.5%;bottom:10px;border-color:#6a3a00;background:linear-gradient(#f0a020,#a0600a)}
#pl{left:10px;top:8px;width:min(46vw,230px)}
.bar{height:18px;border:2px solid #0a2a0a;border-radius:6px;background:#123;position:relative;overflow:hidden}
#hp{height:100%;background:linear-gradient(#5be04a,#1c8a1c);width:100%}.bar span{position:absolute;inset:0;text-align:center;line-height:14px;text-shadow:0 1px 2px #000}
#ql{left:10px;top:78px;width:min(36vw,185px);background:var(--panel);padding:8px;border-radius:6px;font-size:11px}
#ql b{display:block;color:#ffb030;margin-top:6px}#ql b:first-child{margin-top:0}#ql b.d{color:#6df06d}
#area{top:6px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 1px 3px #000}
#top{right:8px;top:6px;display:flex;gap:6px}
.ic{width:46px;text-align:center;font-size:9px;text-shadow:0 1px 2px #000;cursor:pointer}.ic div{width:38px;height:38px;margin:0 auto;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(#b86a30,#4a2410);font-size:19px;line-height:32px}
#mm{right:10px;top:78px;width:100px;height:100px;border-radius:50%;border:4px solid var(--gold);background:#c8601c}
#joy{left:22px;bottom:34px;width:116px;height:116px;border-radius:50%;background:rgba(255,200,150,.25);border:3px solid rgba(255,220,180,.4)}
#kn{position:absolute;left:33px;top:33px;width:50px;height:50px;border-radius:50%;background:rgba(255,220,190,.7)}
#acts{right:14px;bottom:30px;width:180px;height:180px}
.sk{position:absolute;width:48px;height:48px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(#ff9a30,#8a2a08);font-size:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.sk .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.65)}
#a0{right:0;bottom:0;width:80px;height:80px;font-size:34px}#a1{right:92px;bottom:8px}#a2{right:74px;bottom:70px}#a3{right:8px;bottom:92px}
#xpb{left:0;right:0;bottom:0;height:14px;background:rgba(0,0,0,.45)}#xpf{height:100%;background:#1fb0e8;width:0}#xpt{position:absolute;left:8px;top:0;font-size:10px;line-height:14px}
#inv{left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,480px);height:min(80vh,430px);overflow:auto;background:var(--panel);border:3px solid var(--gold);border-radius:8px;padding:10px;display:none}
#ig{display:flex;flex-wrap:wrap;gap:6px;min-height:52px}#inv h4{margin:10px 0 6px;font-size:12px;color:var(--gl);letter-spacing:1px}.it{width:46px;height:46px;background:rgba(255,180,120,.2);border-radius:6px;text-align:center;font-size:24px;line-height:36px;position:relative}.it small{position:absolute;right:3px;bottom:0;font-size:10px;line-height:12px}
#toast{left:50%;top:60px;transform:translateX(-50%);background:var(--panel);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .3s;pointer-events:none}
.dn{position:fixed;font:800 17px system-ui;text-shadow:0 1px 3px #000;transform:translate(-50%,-50%);pointer-events:none}
#ui{z-index:3}body::after{content:'';position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(50,12,0,.5))}
.title,#ql,#inv,#toast{border:1px solid rgba(227,164,28,.55);box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 0 12px rgba(255,170,60,.12);backdrop-filter:blur(3px)}
.b{border-color:#e3a41c;box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.sk,.ic div{box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,220,160,.4)}#mm{box-shadow:0 0 14px rgba(255,140,40,.5)}#hp{box-shadow:inset 0 2px 3px rgba(255,255,255,.35)}

:root{--gold:#e8b04a;--gl:#ffe29a;--ft:'Cinzel',Georgia,serif}
body,.b,input,button,.dn{font-family:var(--ft)}
.title,#ql,#inv,#pl,#toast{background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 7px),linear-gradient(160deg,#52423b,#2a201d 55%,#3b2d27);border:2px solid #0e0705;border-radius:5px;color:#f3dfb8;backdrop-filter:none;box-shadow:0 0 0 2px #b8862e,0 0 0 4px #2e1b0e,0 0 0 5px #e8b04a,0 8px 22px #000b,inset 0 0 26px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,226,154,.2)}
.title::before,#ql::before,#inv::before,#pl::before,#toast::before{content:'';position:absolute;inset:3px;pointer-events:none;border:1px solid rgba(232,176,74,.3);background:radial-gradient(circle at 0 0,var(--gl) 0 3px,transparent 4px),radial-gradient(circle at 100% 0,var(--gl) 0 3px,transparent 4px),radial-gradient(circle at 0 100%,var(--gl) 0 3px,transparent 4px),radial-gradient(circle at 100% 100%,var(--gl) 0 3px,transparent 4px)}
.title{font-weight:800;font-size:16px;letter-spacing:2px;color:var(--gl);text-shadow:0 0 12px #ff8a28,0 2px 2px #000}
#pl{padding:8px 12px}#pn{font-size:15px;color:var(--gl);text-shadow:0 0 8px #ff8a28}#area{color:var(--gl);letter-spacing:1px;text-shadow:0 0 10px #ff8a28,0 2px 3px #000}
.bar{height:20px;border:2px solid #0e0705;border-radius:3px;background:#1a0a08;box-shadow:0 0 0 1px #b8862e,inset 0 2px 5px #000}
#hp{background:linear-gradient(#ff7a5a,#d02a1a 45%,#7a0e0e);box-shadow:0 0 10px #ff3a1a,inset 0 2px 3px rgba(255,255,255,.4);transition:width .3s}
#xpb{background:#150907;border-top:2px solid #b8862e}#xpf{background:linear-gradient(#7fe0ff,#1a7ad0);box-shadow:0 0 10px #3ab8ff}
.b{background:linear-gradient(#5e4d44,#2e2420 50%,#1e1512);border:2px solid #0e0705;border-radius:4px;color:#ffe6b0;letter-spacing:.5px;text-shadow:0 1px 2px #000;box-shadow:0 0 0 1px #b8862e,0 0 0 3px #2e1b0e,0 3px 10px #000a,inset 0 1px 0 rgba(255,226,154,.45),inset 0 -8px 12px rgba(0,0,0,.4);transition:box-shadow .15s,transform .1s}
.b:hover,.b:active{box-shadow:0 0 0 1px #ffd070,0 0 0 3px #2e1b0e,0 0 16px 2px #ff8a28,inset 0 1px 0 rgba(255,226,154,.6)}.b:active{transform:scale(.97)}
.b i{color:var(--gold);text-shadow:0 0 6px #ff8a28}
button.g,button.o{font-family:var(--ft);font-weight:800;letter-spacing:1px;color:#2a1204;text-shadow:0 1px 0 rgba(255,255,255,.4);border:2px solid #0e0705;border-radius:4px;background:linear-gradient(#ffe29a,#e8b04a 50%,#a8661a);box-shadow:0 0 0 2px #2e1b0e,0 0 18px rgba(255,140,40,.6),inset 0 1px 0 #fff8;animation:gl 2s ease-in-out infinite}
button.o{background:linear-gradient(#ff9a50,#d0481a 55%,#7a2208);color:#fff0d0}@keyframes gl{50%{filter:brightness(1.2)}}
input{background:#150a07;border:2px solid #b8862e;color:var(--gl);font-family:var(--ft);box-shadow:inset 0 0 10px #000,0 0 0 2px #2e1b0e}
.ic{color:#f3dfb8}.ic div{border:0;line-height:38px;background:radial-gradient(circle at 35% 30%,#6a4a3a,#241410 70%);box-shadow:0 0 0 2px #e8b04a,0 0 0 4px #2e1b0e,0 0 12px rgba(255,140,40,.45),0 4px 8px #000a,inset 0 0 8px #000}
.ic:hover div,.ic:active div{box-shadow:0 0 0 2px #ffe29a,0 0 0 4px #2e1b0e,0 0 20px 3px #ff8a28,inset 0 0 8px #000}
#mm{border:4px solid #b8862e;background:#3a1a12;box-shadow:0 0 0 3px #2e1b0e,0 0 0 5px #e8b04a,0 0 20px rgba(255,120,30,.55),inset 0 0 14px #000}
#joy{background:radial-gradient(circle,rgba(20,8,4,.55) 55%,rgba(60,40,30,.5) 56%);border:3px solid #b8862e;box-shadow:0 0 0 2px #2e1b0e,0 0 18px rgba(255,140,40,.35),inset 0 0 18px #000}
#kn{background:radial-gradient(circle at 35% 30%,#ffe29a,#b8862e 55%,#5a3a10);box-shadow:0 0 12px #ff9a30,0 3px 6px #000}
.sk{border:3px solid #0e0705;background:radial-gradient(circle at 50% 30%,#4a362c,#150b08 75%);box-shadow:0 0 0 2px #e8b04a,0 0 0 4px #2e1b0e,0 4px 10px #000a,inset 0 0 12px #000}
.sk svg{width:62%;height:62%;filter:drop-shadow(0 0 5px var(--c))}.sk:active{filter:brightness(1.4)}
#a0{--c:#8fd0ff}#a1{--c:#ff6a1a}#a2{--c:#ffd23a}#a3{--c:#4cff7a}
.sk.rdy{animation:rd 1.8s ease-in-out infinite}@keyframes rd{50%{box-shadow:0 0 0 2px var(--c),0 0 0 4px #2e1b0e,0 0 22px 6px var(--c),inset 0 0 14px rgba(0,0,0,.6)}}
.sk.pr{animation:pr .38s ease-out}@keyframes pr{0%{transform:scale(.86);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c),0 0 38px 16px var(--c),inset 0 0 18px var(--c)}100%{transform:none}}
#inv>b{font-size:15px;color:var(--gl);letter-spacing:1px}.it{background:radial-gradient(circle,#4a3a32,#1c1310);border:2px solid #6a4a22;box-shadow:inset 0 0 8px #000,0 0 6px rgba(255,140,40,.2)}
.dn{font-weight:800;-webkit-text-stroke:1px #2a0a00;text-shadow:0 0 8px currentColor,0 2px 3px #000}
body::after{background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(18,3,0,.72))}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* Responsive: tutta l'interfaccia scala con --u (impostata in rs()) */
:root{--u:1}
#pl,#ql{transform-origin:0 0;transform:scale(var(--u));left:max(10px,env(safe-area-inset-left,0px))}
#ql{top:calc(8px + 72px*var(--u))}
#top,#mm{transform-origin:100% 0;transform:scale(var(--u))}
#top{right:max(8px,env(safe-area-inset-right,0px))}#mm{right:max(10px,env(safe-area-inset-right,0px));top:calc(6px + 66px*var(--u))}
#area,#toast,.title,.bot{transform:translateX(-50%) scale(var(--u));transform-origin:50% 0}.bot{transform-origin:50% 100%}
@media(max-aspect-ratio:1/1){#area{top:calc(8px + 72px*var(--u))}}
#joy{transform-origin:0 100%;transform:scale(var(--u));left:max(22px,calc(env(safe-area-inset-left,0px) + 14px));bottom:max(34px,calc(env(safe-area-inset-bottom,0px) + 22px))}
#acts{transform-origin:100% 100%;transform:scale(var(--u));right:max(14px,calc(env(safe-area-inset-right,0px) + 10px));bottom:max(30px,calc(env(safe-area-inset-bottom,0px) + 20px))}
#xpb{height:calc(10px + 4px*var(--u))}
#inv{transform:translate(-50%,-50%) scale(var(--u));width:min(calc(92vw/var(--u)),480px);height:min(calc(80vh/var(--u)),430px)}
.col{transform:scale(var(--u))}.l{transform-origin:0 0}.r{transform-origin:100% 0}
button.o{transform-origin:100% 100%;transform:scale(var(--u))}
.dn{font-size:calc(13px + 4px*var(--u))}

/* ===== Negozio + Scrigno delle Braci ===== */
#sh{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(8,3,1,.8);padding:max(6px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));font-family:var(--ft);color:#f3dfb8}
#sh *{touch-action:pan-y}#sh canvas{touch-action:none}
.shp{position:relative;width:min(100%,860px);height:100%;max-height:620px;display:flex;flex-direction:column;gap:6px;padding:8px;overflow:hidden;background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 7px),linear-gradient(160deg,#52423b,#2a201d 55%,#3b2d27);border:2px solid #0e0705;border-radius:5px;box-shadow:0 0 0 2px #b8862e,0 0 0 4px #2e1b0e,0 8px 30px #000c,inset 0 0 26px rgba(0,0,0,.6)}
.shh{display:flex;align-items:center;gap:8px}.shh b{flex:1;font-size:15px;letter-spacing:1px;color:var(--gl);text-shadow:0 0 8px #ff8a28}
.shg{background:#150a07;border:1px solid #b8862e;border-radius:12px;padding:3px 10px;color:#7fe0ff;font-size:13px}
.shx,.shq{width:30px;height:30px;border-radius:50%;border:2px solid #b8862e;background:#2a1a14;color:#ffe29a;font:800 14px var(--ft);padding:0}.shq{width:24px;height:24px;font-size:13px}
.shm{flex:1;min-height:0;display:flex;gap:8px}
.shv{position:relative;flex:0 0 38%;border:2px solid #0e0705;border-radius:6px;overflow:hidden;background:radial-gradient(ellipse at 50% 75%,#6a4228,#1a0c08 78%);box-shadow:0 0 0 1px #b8862e,inset 0 0 20px #000}
#pv{width:100%;height:100%;display:block}
.shv small{position:absolute;left:4px;right:4px;bottom:3px;text-align:center;font-size:9px;color:#e8b04a;text-shadow:0 1px 2px #000;pointer-events:none}
.shr{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
.sht{display:flex;gap:6px}.sht button{flex:1;padding:7px;border-radius:4px;border:2px solid #0e0705;background:linear-gradient(#4a3a32,#241a16);color:#c9b48a;font:800 12px var(--ft);box-shadow:0 0 0 1px #6a4a22}
.sht .on{color:#2a1204;background:linear-gradient(#ffe29a,#e8b04a 55%,#a8661a);box-shadow:0 0 0 1px #ffd070,0 0 12px rgba(255,140,40,.5)}
#shc{flex:1;min-height:0;overflow:auto;padding:0 2px 4px}#shc h4{margin:8px 0 5px;font-size:12px;color:var(--gl);letter-spacing:1px}
.shgd{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.shc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;text-align:center;border-radius:6px;background:radial-gradient(circle at 50% 30%,#4a3a32,#1c1310);border:2px solid #6a4a22;cursor:pointer}
.shc.on{border-color:var(--c);box-shadow:0 0 14px var(--c),inset 0 0 10px rgba(0,0,0,.6)}
.shc img{width:60px;height:60px;filter:drop-shadow(0 0 6px var(--c))}.shc b{font-size:11px;color:var(--gl)}.shc small{font-size:9px;color:#b9a47c}
.shb{border:2px solid #0e0705;border-radius:4px;padding:6px 8px;font:800 11px var(--ft);color:#2a1204;background:linear-gradient(#ffe29a,#e8b04a 55%,#a8661a);box-shadow:0 0 0 1px #2e1b0e;touch-action:manipulation}
.shb.eq{background:linear-gradient(#9cf0a0,#2fa040 60%,#146a24);color:#04200a}.shb.big{padding:9px 12px;font-size:12px}.shb:disabled{filter:grayscale(.8) brightness(.7)}
.shn{margin:6px 0;font-size:10px;color:#b9a47c}
.pk{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}.pkh{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gl)}
.chest{width:min(190px,60%);overflow:visible}.em{animation:rise 2s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
.pki{display:flex;gap:8px}.pki div{display:flex;flex-direction:column;align-items:center;font-size:10px;padding:4px;border:2px solid var(--c);border-radius:6px;background:rgba(0,0,0,.35);box-shadow:0 0 12px var(--c)}.pki img{width:46px;height:46px}
.pkp{position:relative;width:min(280px,90%);height:16px;border:2px solid #0e0705;border-radius:4px;background:#1a0a08;overflow:hidden;box-shadow:0 0 0 1px #b8862e}
.pkp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffb060,#d0481a);box-shadow:0 0 8px #ff8a28}.pkp span{position:absolute;inset:0;font-size:10px;line-height:12px;text-shadow:0 1px 2px #000}
.pkb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#od,#rv{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:10px;overflow:auto;background:rgba(6,2,1,.9);z-index:2}
.odb{width:min(100%,420px);display:flex;flex-direction:column;gap:6px;font-size:11px}.odb>b{color:var(--gl);font-size:13px;text-align:center}
.odr{display:flex;align-items:center;gap:8px;padding:4px 6px;border:2px solid var(--c,#6a4a22);border-radius:6px;background:rgba(0,0,0,.35);box-shadow:0 0 10px var(--c,transparent)}
.odr img{width:40px;height:40px}.odr span{flex:1}.odr small{display:block;color:#b9a47c;font-size:9px}.odr em{font-style:normal;font-size:14px;color:var(--c,#f3dfb8)}
.rvg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:100%}
.rvc{width:104px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;text-align:center;border-radius:8px;border:2px solid var(--c);background:radial-gradient(circle at 50% 35%,var(--c),#1a0c08 72%);box-shadow:0 0 22px 4px var(--c);animation:pop .5s ease-out backwards}
.rvc img{width:64px;height:64px}.rvc b{font-size:11px;color:#fff;text-shadow:0 1px 3px #000}.rvc small{font-size:9px;color:#ffe9b0}.rvc .co{font-size:34px}.rvc.pt{animation:pop .5s ease-out backwards,gl 1.2s ease-in-out infinite}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
#st{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#150a07;border:1px solid #e8b04a;border-radius:6px;padding:6px 12px;font-size:11px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:3;white-space:nowrap}
@media(max-aspect-ratio:1/1){.shm{flex-direction:column}.shv{flex:0 0 38%}}
/* HUD semplificato: missioni e personaggio */
#pl,#ql{background:rgba(24,12,8,.55);border:1px solid rgba(232,176,74,.4);border-radius:8px;box-shadow:none;font:600 11px system-ui,sans-serif;color:#f3dfb8}
#pl::before,#ql::before{display:none}
#pl{padding:5px 9px;width:min(40vw,176px)}#pl br,#pl small:not(#lv){display:none}
#pn{font-size:13px;color:#ffe29a;text-shadow:none}#lv{margin-left:6px;color:#ffb030;font-size:11px}
#pl .bar{height:12px;margin-top:3px;border:1px solid rgba(0,0,0,.6);border-radius:6px;background:rgba(0,0,0,.45);box-shadow:none}
#pl #hp{border-radius:6px;box-shadow:none;background:linear-gradient(#ff7a5a,#c42a1a)}#pl .bar span{font-size:9px;line-height:10px;text-shadow:none}
#ql{top:calc(8px + 54px*var(--u));width:min(40vw,176px);padding:5px 9px}
